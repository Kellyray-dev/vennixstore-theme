name: Theme Check

# The repo ships a .theme-check.yml but nothing ever ran it. This closes that gap:
# every push and pull request now gets the same lint a `shopify theme check` run
# would produce locally, plus structural checks the Ruby tool does not cover
# (template JSON must parse, and the settings written into templates must still
# exist in the sections they configure).
#
# INSTALL: this file lives outside .github/workflows because the automation that
# pushed it lacks the GitHub App `workflows` permission. To activate it, either
# grant that permission, or run:
#
#   mkdir -p .github/workflows && git mv ci/theme-check.workflow.yml .github/workflows/theme-check.yml

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theme-check:
    name: Lint Liquid, JSON and assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install theme-check
        run: gem install theme-check --no-document

      # --fail-level error keeps the three pre-existing LiquidComplexity suggestions
      # (Dawn base files: card-product, main-product, facets) advisory rather than
      # blocking, while still failing on anything that is a real error.
      - name: Run theme-check
        run: theme-check --fail-level error --output text .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Liquid formatting
        run: |
          npm install --no-save --silent @shopify/prettier-plugin-liquid prettier@3
          npx prettier --plugin=@shopify/prettier-plugin-liquid --check '**/*.liquid' || {
            echo "::warning::Liquid formatting differs from .prettierrc.json. Run: npx prettier --plugin=@shopify/prettier-plugin-liquid --write '**/*.liquid'"
          }

      - name: Validate template JSON and section-schema drift
        run: python3 scripts/validate_theme.py

      # Self-test for the step above: injects one fault of each class the checker claims to
      # catch, runs the real script against it, and asserts it is reported. Without this the
      # gate could quietly stop catching anything — which is how the node_modules bug that
      # made it scan npm fixtures went unnoticed.
      - name: Test the validator
        run: python3 scripts/test_validate_theme.py
